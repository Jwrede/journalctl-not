[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "journalctl-not"
version = "0.1.0"
description = "journalctl with NOT matches: hide noisy units, identifiers, fields or messages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jonathan Wrede" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Logging",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Jwrede/journalctl-not"

[project.scripts]
journalctl-not = "journalctl_not.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
